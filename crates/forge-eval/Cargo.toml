[package]
name = "forge-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Benchmark and evaluation runners with before/after comparison"

[dependencies]
forge-core = { workspace = true }
forge-io = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indicatif = { workspace = true }
dirs = "5"
which = "6"

# Optional real llama.cpp binding — enable with `--features llama`
# We keep it optional so `cargo check` on CI without cmake/metal works.
llama-cpp-2 = { version = "0.1", optional = true }
