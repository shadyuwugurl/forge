[package]
name = "forge-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop GUI for forge (Tauri + Vue)"

[[bin]]
name = "forge-gui"
path = "src/main.rs"

[dependencies]
forge-core = { workspace = true }
forge-io = { workspace = true }
forge-merge = { workspace = true }
forge-quant = { workspace = true }
forge-eval = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

# Tauri 2 (feature-gated so `cargo check` works without system webview deps on CI)
# Enable with `--features tauri`
tauri = { version = "2", optional = true, features = ["protocol-asset"] }

[features]
default = []
tauri = ["dep:tauri"]
